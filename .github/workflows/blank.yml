name: build-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Salseo.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar que existe Salseo.zip
        run: |
          test -f Salseo.zip
          ls -lh Salseo.zip

      - name: Descomprimir Salseo.zip
        run: |
          rm -rf Salseo_build
          mkdir -p Salseo_build
          unzip -q Salseo.zip -d Salseo_build

      - name: Detectar carpeta del proyecto
        run: |
          PROJECT_DIR="$(find Salseo_build -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró package.json dentro de Salseo.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto detectado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mostrar versiones
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependencias con npm
        run: |
          cd "$PROJECT_DIR"
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Compilar web
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Sincronizar Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Generar TXT con SHA1 del APK Debug
        run: |
          APK_PATH="$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -name "*.apk" -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "No se encontró el APK debug generado"
            exit 1
          fi

          echo "APK encontrado en: $APK_PATH"

          SHA1=""

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1 || true)"

          if [ -n "$APKSIGNER" ]; then
            echo "Usando apksigner: $APKSIGNER"
            SHA1="$("$APKSIGNER" verify --print-certs "$APK_PATH" | sed -n 's/.*SHA-1 digest: //p' | head -n 1)"
          fi

          if [ -z "$SHA1" ] && [ -f "$HOME/.android/debug.keystore" ]; then
            echo "No se pudo extraer SHA1 del APK. Intentando con debug.keystore..."
            SHA1="$(keytool -list -v \
              -alias androiddebugkey \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android 2>/dev/null \
              | sed -n 's/.*SHA1: //p' \
              | head -n 1)"
          fi

          if [ -z "$SHA1" ]; then
            echo "No se pudo obtener el SHA1"
            exit 1
          fi

          {
            echo "SHA1=$SHA1"
            echo "APK=$APK_PATH"
            echo "GeneradoUTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          } > "$PROJECT_DIR/sha1.txt"

          echo "SHA1 generado:"
          cat "$PROJECT_DIR/sha1.txt"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Salseo-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Subir TXT con SHA1 como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Salseo-debug-sha1
          path: ${{ env.PROJECT_DIR }}/sha1.txt
          if-no-files-found: error
          retention-days: 7
